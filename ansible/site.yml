---
- name: Provision developer workstation
  hosts: workstation
  become: true
  gather_facts: true

  pre_tasks:
    - name: Fail early on unsupported distributions
      ansible.builtin.assert:
        that: ansible_os_family == 'Debian'
        fail_msg: >-
          This playbook targets Debian/Ubuntu. Detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_os_family }} family).
      tags: always

    # apt speaks dpkg architecture names (amd64, arm64); the kernel — and so
    # ansible_architecture — speaks x86_64 and aarch64. The two never match, and
    # mapping between them here would be guesswork: a 32-bit userland on a
    # 64-bit kernel reports aarch64 while apt resolves armhf. Ask dpkg, which is
    # the same thing apt itself consults.
    #
    # check_mode: false because --check skips command tasks by default, which
    # would leave deb_arch empty and trip the architecture assert below — the
    # whole dry run dies at the third task, before reporting anything. Reading
    # a value is not a change, so the probe should run either way. Same applies
    # to every read-only probe further down, each marked the same way.
    - name: Detect dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch_probe
      changed_when: false
      check_mode: false
      tags: always

    - name: Record dpkg architecture
      ansible.builtin.set_fact:
        deb_arch: "{{ dpkg_arch_probe.stdout | trim }}"
      tags: always

    - name: Fail early on unsupported architectures
      ansible.builtin.assert:
        that: deb_arch in supported_deb_architectures
        fail_msg: >-
          Architecture '{{ deb_arch }}' is not in supported_deb_architectures
          ({{ supported_deb_architectures | join(', ') }}). The third-party apt
          repos configured below publish those two; on anything else the repo
          indices 404 and the run fails partway through.
      tags: always

    - name: Resolve target user
      ansible.builtin.assert:
        that:
          - target_user | length > 0
          - target_user != 'root'
        fail_msg: >-
          target_user resolved to '{{ target_user }}'. Set it explicitly, e.g.
          -e target_user=ahill
      tags: always

    # The `creates:` guards on the user-scoped installs below are evaluated
    # with glob.glob(), which does NOT expand `~` — a tilde path there matches
    # nothing, so the guard never fires and the installer it guards re-runs on
    # every play, reporting changed forever. Resolve the home directory once
    # here and use it literally.
    #
    # check_mode: false for the same reason as the probes above: reading a
    # value is not a change, and skipping it would leave target_user_home empty
    # and point three creates: paths at /.local/bin during a dry run.
    #
    # Like target_user and ansible_become_exe, this reads the machine Ansible
    # is connected to, which is this one only because the inventory is
    # `localhost ansible_connection=local`.
    - name: Resolve the target user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ target_user }}"
      check_mode: false
      tags: always

    # getent_passwd drops the name and keeps the remaining fields in order:
    # password, uid, gid, gecos, home, shell.
    - name: Record the target user's home directory
      ansible.builtin.set_fact:
        target_user_home: "{{ ansible_facts.getent_passwd[target_user][4] }}"
      tags: always

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: always

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      tags: always

  tasks:
    # ------------------------------------------------------------------ base
    - name: Install Git
      ansible.builtin.apt:
        name: git
        state: present
      when: install_git | bool
      tags: [base, git]

    - name: Install btop
      ansible.builtin.apt:
        name: btop
        state: present
      when: install_btop | bool
      tags: [base, btop]

    # ------------------------------------------------------------ github cli
    # The archive ships gh too, but frozen at release — 2.46 on resolute, years
    # behind upstream — and gh warns on every invocation once it drifts. Take it
    # from GitHub's repo like the other vendor tools here.
    #
    # GitHub's published instructions put the keyring at
    # /usr/share/keyrings/githubcli-archive-keyring.gpg and write a legacy
    # github-cli.list. Adopt that keyring path rather than /etc/apt/keyrings:
    # a .sources naming a different keyring for the same URI is the "Conflicting
    # values set for option Signed-By" hard failure that breaks *every* source
    # list, not just this one. The .list is then removed so the two never
    # coexist. Same reasoning as the Tailscale and Brave blocks below.
    #
    # The key is a binary keyring, not ASCII armour, hence .gpg rather than the
    # .asc used for Docker and Chrome.
    - name: GitHub CLI | Fetch signing key
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
        mode: "0644"
      when: install_gh | bool
      tags: [base, gh]

    - name: GitHub CLI | Drop legacy source from the upstream instructions
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/github-cli.list
        state: absent
      when: install_gh | bool
      tags: [base, gh]

    - name: GitHub CLI | Configure apt repository
      ansible.builtin.deb822_repository:
        name: github-cli
        types: [deb]
        uris: https://cli.github.com/packages
        suites: [stable]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /usr/share/keyrings/githubcli-archive-keyring.gpg
        state: present
        enabled: true
      register: gh_repo
      when: install_gh | bool
      tags: [base, gh]

    # 'latest' rather than the 'present' used everywhere else, because the
    # archive may have installed gh already: apt would then consider the package
    # satisfied and leave the stale build in place, so adding the repo above
    # would change nothing until some unrelated `apt upgrade` came along. Both
    # versions are the same package name, so the higher one simply wins — no
    # pinning needed.
    - name: GitHub CLI | Install
      ansible.builtin.apt:
        name: gh
        state: latest
        update_cache: "{{ gh_repo.changed | default(false) }}"
      when: install_gh | bool
      tags: [base, gh]

    # -------------------------------------------------------------- appimage
    # AppImages (LM Studio, Cursor, ...) dlopen libfuse.so.2 on startup and
    # abort with "dlopen(): error loading libfuse.so.2" when it is missing —
    # nothing pulls it in by default since the archive moved to FUSE 3.
    #
    # Ubuntu's 64-bit time_t transition renamed libfuse2 -> libfuse2t64 in
    # 24.04, so the name depends on the release. Probe the cache rather than
    # branch on ansible_distribution_version: those numbers are not comparable
    # across the derivatives this may run on (Mint 22 *is* Ubuntu 24.04, but
    # reports 22). The pre_tasks apt update above makes the cache current.
    - name: AppImage | Detect FUSE 2 package name
      ansible.builtin.command: apt-cache policy libfuse2t64
      register: fuse2t64_policy
      changed_when: false
      failed_when: false
      check_mode: false
      when: install_appimage_support | bool
      tags: [base, appimage]

    # apt-cache policy exits 0 with empty stdout for an unknown package, so
    # presence of output — not rc — is the signal.
    - name: AppImage | Install FUSE 2 runtime
      ansible.builtin.apt:
        name: "{{ 'libfuse2t64' if (fuse2t64_policy.stdout | default('') | trim | length > 0) else 'libfuse2' }}"
        state: present
      when: install_appimage_support | bool
      tags: [base, appimage]

    # --------------------------------------------------------------- node.js
    # NodeSource, not the archive: `nodejs` there is frozen at release (18.x on
    # noble, already end-of-life) and comes split from `npm`, which pulls a
    # second nodejs dependency behind it. NodeSource ships one package with
    # both, per major line, built for amd64 and arm64.
    #
    # Older NodeSource setup scripts wrote a legacy nodesource.list naming a
    # keyring in /usr/share/keyrings. Left in place beside the .sources below
    # it is the "Conflicting values set for option Signed-By" hard failure that
    # breaks *every* apt source, the same trap the Brave and Chrome blocks
    # handle — so drop it. Only the .list: deleting a .sources here would
    # delete what this play just wrote.
    - name: Node.js | Drop the legacy NodeSource source list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/nodesource.list
        state: absent
      when: install_nodejs | bool
      tags: [languages, nodejs]

    - name: Node.js | Fetch signing key
      ansible.builtin.get_url:
        url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        dest: /etc/apt/keyrings/nodesource.asc
        mode: "0644"
      when: install_nodejs | bool
      tags: [languages, nodejs]

    # 'nodistro' is not a placeholder: NodeSource publishes a single
    # distro-independent index rather than one suite per Ubuntu codename, so
    # unlike Docker or Brave this suite is a literal and does not track
    # ansible_distribution_release.
    - name: Node.js | Configure apt repository
      ansible.builtin.deb822_repository:
        name: nodesource
        types: [deb]
        uris: "https://deb.nodesource.com/node_{{ nodejs_major }}.x"
        suites: [nodistro]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/nodesource.asc
        state: present
        enabled: true
      register: nodejs_repo
      when: install_nodejs | bool
      tags: [languages, nodejs]

    # Without this, which build wins is left to version-string comparison
    # between two unrelated numbering schemes. That happens to favour
    # NodeSource today, but it is not something to rely on: an Ubuntu release
    # carrying the same major would decide it the other way, and the machine
    # would quietly hold the archive's nodejs instead. Priority 600 is above
    # the 500 an ordinary repo gets, and this is the file NodeSource's own
    # setup script writes.
    - name: Node.js | Pin the nodejs package to NodeSource
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/nodesource
        content: |
          Package: nodejs
          Pin: origin deb.nodesource.com
          Pin-Priority: 600
        mode: "0644"
      when:
        - install_nodejs | bool
        - nodejs_pin_nodesource | bool
      tags: [languages, nodejs]

    # No `npm` in this list — NodeSource's nodejs package carries npm itself,
    # and the archive's npm would drag the archive's nodejs back in with it.
    - name: Node.js | Install Node {{ nodejs_major }}.x and npm
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: "{{ nodejs_repo.changed | default(false) }}"
      when: install_nodejs | bool
      tags: [languages, nodejs]

    # ------------------------------------------------------------------ rust
    # rustup, run as target_user — the same shape as the Claude Code native and
    # OpenCode installs, and for the same reason: it installs into a home
    # directory and updates itself from then on (`rustup update`). The archive
    # has a `rustc`, but it is one frozen compiler with no channel switching,
    # no target installs and no component management, against an upstream that
    # releases every six weeks.
    #
    # rustc does not link binaries itself; it invokes cc. With no C toolchain
    # present every `cargo build` fails at the link step with "linker `cc` not
    # found", and nothing in rustup's own install provides one — Ubuntu's rustc
    # package depends on gcc for exactly this reason.
    - name: Rust | Install a linker
      ansible.builtin.apt:
        name: build-essential
        state: present
      when:
        - install_rust | bool
        - rust_install_linker | bool
      tags: [languages, rust]

    # -y suppresses the installer's interactive confirmation; without it the
    # script sits waiting on stdin. The PATH edit is left to rustup, which
    # appends `. "$HOME/.cargo/env"` to ~/.profile and to the shell rc files it
    # finds, rather than being written here as a lineinfile task like
    # OpenCode's: ~/.cargo/env does more than prepend a directory, and
    # hand-writing half of it would drift from what `rustup self update` keeps
    # current.
    - name: Rust | Install rustup and the {{ rust_toolchain }} toolchain for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs
          | sh -s -- -y
          --profile {{ rust_profile }}
          --default-toolchain {{ rust_toolchain }}
        executable: /bin/bash
        creates: "{{ target_user_home }}/.cargo/bin/rustup"
      when: install_rust | bool
      tags: [languages, rust]

    # The install above is a one-off, guarded by creates:, so on its own a
    # later change to rust_toolchain would have no effect at all — the variable
    # would describe something the machine does not have. These two tasks are
    # what make it mean something on every run.
    #
    # Called by absolute path: ~/.cargo/bin reaches PATH only through
    # ~/.cargo/env, which a login shell sources and Ansible's non-interactive
    # one does not.
    - name: Rust | Check the active toolchain
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.command: "{{ target_user_home }}/.cargo/bin/rustup show active-toolchain"
      register: rust_active
      changed_when: false
      # Non-zero means rustup is not installed yet, which is a state to read —
      # the task above installs it moments earlier, or is skipped in check mode.
      failed_when: false
      check_mode: false
      when: install_rust | bool
      tags: [languages, rust]

    # `rustup show active-toolchain` prints e.g.
    # "stable-x86_64-unknown-linux-gnu (default)", so the configured name is a
    # prefix of it — matching the whole string would mean knowing the host
    # triple, and a prefix test is unambiguous here because no channel name or
    # version number is a prefix of another.
    - name: Rust | Make {{ rust_toolchain }} the default toolchain
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.command: "{{ target_user_home }}/.cargo/bin/rustup default {{ rust_toolchain }}"
      register: rust_default
      changed_when: rust_default.rc == 0
      when:
        - install_rust | bool
        - not (rust_active.stdout | default('')).startswith(rust_toolchain)
      tags: [languages, rust]

    # -------------------------------------------------------------------- go
    # Upstream's tarball into /usr/local, which is what go.dev documents. The
    # archive's golang-go trails by a release or more and never moves within
    # one (noble is on 1.22), and Go's compatibility promise makes tracking
    # current cheap. Tarball names use dpkg's architecture spelling —
    # go1.25.1.linux-amd64.tar.gz — so deb_arch drops straight in, exactly as
    # it does for the DevPod asset.
    #
    # check_mode: false for the same reason as the probes above: this only
    # reads, and skipping it would leave go_resolved_version undefined and fail
    # the dry run two tasks later.
    - name: Go | Resolve the latest release
      ansible.builtin.uri:
        url: https://go.dev/VERSION?m=text
        return_content: true
      register: go_latest
      check_mode: false
      when:
        - install_go | bool
        - go_version == 'latest'
      tags: [languages, go]

    # That endpoint returns two lines — "go1.25.1" then a "time ..." stamp — so
    # take the first and drop the "go" prefix, which the download URL spells
    # out itself rather than repeating.
    - name: Go | Record the version to install
      ansible.builtin.set_fact:
        go_resolved_version: >-
          {{ (go_latest.content.splitlines()[0] | trim | regex_replace('^go', ''))
             if go_version == 'latest'
             else go_version }}
      when: install_go | bool
      tags: [languages, go]

    - name: Go | Check which version is installed
      ansible.builtin.command: "{{ go_install_dir }}/go/bin/go version"
      register: go_installed
      changed_when: false
      # Non-zero here means "not installed yet", which is a state to read.
      failed_when: false
      check_mode: false
      when: install_go | bool
      tags: [languages, go]

    # `go version` prints "go version go1.25.1 linux/amd64". Matched against
    # the whitespace-split tokens rather than as a substring, for the reason
    # the SOPS block gives: "go1.25" occurs inside "go1.25.1", and a substring
    # test would decide an older toolchain was already the requested one.
    #
    # Removed rather than unpacked over: the tarball has no manifest of what it
    # replaces, so files dropped between releases would survive an in-place
    # extract and stay on PATH. `rm -rf /usr/local/go` first is upstream's own
    # documented upgrade step.
    - name: Go | Remove the previous toolchain
      ansible.builtin.file:
        path: "{{ go_install_dir }}/go"
        state: absent
      when:
        - install_go | bool
        - ('go' ~ go_resolved_version) not in (go_installed.stdout | default('')).split()
      tags: [languages, go]

    # Unpacked from curl rather than with ansible.builtin.unarchive, which
    # fetches the archive *before* it consults check mode: a `--check --diff`
    # dry run would download 80 MB to decide it was going to change something.
    # A shell task is skipped in check mode instead, and the version comparison
    # in `when:` is what keeps it a no-op on an up-to-date machine — hence the
    # rc-guarded changed_when rather than creates:, which cannot express an
    # upgrade.
    - name: Go | Install Go {{ go_resolved_version | default('') }}
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          curl -fsSL https://go.dev/dl/go{{ go_resolved_version }}.linux-{{ deb_arch }}.tar.gz
          | tar -C {{ go_install_dir }} -xzf -
        executable: /bin/bash
      register: go_unpack
      changed_when: go_unpack.rc == 0
      when:
        - install_go | bool
        - ('go' ~ go_resolved_version) not in (go_installed.stdout | default('')).split()
      tags: [languages, go]

    # System-wide, because /usr/local/go is root-owned and shared. $HOME
    # expands in the reading user's own shell, so one file also gives each of
    # them the ~/go/bin that `go install` writes to. Login shells only —
    # /etc/profile.d is not read by non-interactive ones, so a fresh session is
    # needed before `go` is on PATH.
    - name: Go | Put the toolchain on PATH system-wide
      ansible.builtin.copy:
        dest: "{{ go_profile_script }}"
        content: |
          # Managed by ANS-DevMachine-Linux (ansible/site.yml).
          export PATH="$PATH:{{ go_install_dir }}/go/bin:$HOME/go/bin"
        mode: "0644"
      when: install_go | bool
      tags: [languages, go]

    # ---------------------------------------------------------------- docker
    - name: Docker | Purge distro-packaged versions
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: true
      when:
        - install_docker | bool
        - docker_purge_distro_packages | bool
      tags: [docker]

    - name: Docker | Fetch signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Configure apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true
      register: docker_repo
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Install engine, CLI and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repo.changed | default(false) }}"
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Enable and start service
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Add {{ target_user }} to docker group
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true
      when:
        - install_docker | bool
        - docker_add_user_to_group | bool
      tags: [docker]

    # ---------------------------------------------------------------- devpod
    # No apt repo, no distro package and no installer script: the documented
    # Linux install is a bare one-liner,
    #   curl -L -o devpod ".../releases/latest/download/devpod-linux-amd64" \
    #     && sudo install -c -m 0755 devpod /usr/local/bin && rm -f devpod
    # which is what the get_url below is — same asset, same destination, same
    # mode, minus the temp file. Asset names are
    # devpod-linux-<arch> using dpkg's own architecture spelling, so deb_arch
    # drops straight in with no mapping — unlike ansible_architecture, which
    # would say x86_64 and 404.
    #
    # DevPod drives containers through a provider; the default one is docker,
    # which install_docker above provides. Nothing here enforces that pairing —
    # DevPod also targets ssh, kubernetes and cloud providers — but with both
    # toggles off `devpod up` has nothing local to build on.
    #
    # check_mode: false for the same reason as the probes above; the binary is
    # absent on a first run, hence failed_when: false rather than a stat.
    - name: DevPod | Check installed version
      ansible.builtin.command: "{{ devpod_install_dir }}/devpod version"
      register: devpod_installed
      changed_when: false
      failed_when: false
      check_mode: false
      when: install_devpod | bool
      tags: [devpod]

    # `devpod version` prints the bare tag ("v0.6.15", no trailing newline), so
    # it compares directly against devpod_version. A mismatch covers both the
    # missing binary (empty stdout) and an upgrade after bumping the pin.
    - name: DevPod | Install CLI {{ devpod_version }}
      ansible.builtin.get_url:
        url: >-
          https://github.com/loft-sh/devpod/releases/download/{{ devpod_version }}/devpod-linux-{{ deb_arch }}
        dest: "{{ devpod_install_dir }}/devpod"
        owner: root
        group: root
        mode: "0755"
      when:
        - install_devpod | bool
        - (devpod_installed.stdout | default('') | trim) != devpod_version
      tags: [devpod]

    # ------------------------------------------------------------------- kvm
    # x86 advertises virtualization through the vmx/svm cpu flag. arm64 has no
    # equivalent: KVM there depends on the kernel having been entered at EL2,
    # which is the firmware's decision and is not reported in /proc/cpuinfo at
    # all. The honest signal on arm64 is whether the kernel exposed /dev/kvm,
    # which it does independently of the packages installed below.
    - name: KVM | Check for the virtualization cpu flag (x86)
      ansible.builtin.command: grep -Ecm1 '(vmx|svm)' /proc/cpuinfo
      register: kvm_flags
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - install_kvm | bool
        - deb_arch == 'amd64'
      tags: [kvm]

    - name: KVM | Check for /dev/kvm (non-x86)
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_dev
      when:
        - install_kvm | bool
        - deb_arch != 'amd64'
      tags: [kvm]

    - name: KVM | Record whether hardware virtualization is available
      ansible.builtin.set_fact:
        kvm_hw_available: >-
          {{ (kvm_flags.rc | default(1)) == 0
             if deb_arch == 'amd64'
             else (kvm_dev.stat.exists | default(false)) }}
      when: install_kvm | bool
      tags: [kvm]

    # Each hint is its own folded scalar rather than a multi-line literal inside
    # the ternary: YAML keeps the newlines of a more-indented continuation line,
    # which would print the message pre-broken across lines.
    - name: KVM | Warn if hardware virtualization is unavailable
      vars:
        kvm_hint:
          amd64: >-
            No vmx/svm flag in /proc/cpuinfo; check that virtualization is
            enabled in firmware/BIOS.
          other: >-
            No /dev/kvm. On arm64 this usually means the kernel was not entered
            at EL2, which is a firmware/bootloader decision rather than anything
            the OS can change.
      ansible.builtin.debug:
        msg: >-
          {{ kvm_hint[deb_arch] | default(kvm_hint['other']) }}
          Packages will still install, but guests will fall back to slow
          software emulation.
      when:
        - install_kvm | bool
        - not (kvm_hw_available | bool)
      tags: [kvm]

    # Emulator and guest firmware come from kvm_packages_by_arch; see
    # group_vars/all.yml for why the amd64 entry names qemu-system-x86 rather
    # than the qemu-kvm virtual package.
    - name: KVM | Install libvirt and QEMU
      ansible.builtin.apt:
        name: "{{ kvm_packages_common + kvm_packages_by_arch[deb_arch] }}"
        state: present
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Enable and start libvirtd
      ansible.builtin.systemd_service:
        name: libvirtd
        state: started
        enabled: true
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Add {{ target_user }} to libvirt and kvm groups
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: [libvirt, kvm]
        append: true
      when: install_kvm | bool
      tags: [kvm]

    # Done with virsh rather than community.libvirt so the playbook needs
    # nothing beyond ansible-core. Both steps are guarded so they only report
    # changed when they actually do something.
    - name: KVM | List currently active libvirt networks
      ansible.builtin.command: virsh --connect qemu:///system net-list --name
      register: kvm_active_nets
      changed_when: false
      failed_when: false
      check_mode: false
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Start the default network
      ansible.builtin.command: virsh --connect qemu:///system net-start default
      register: kvm_net_start
      changed_when: kvm_net_start.rc == 0
      failed_when: false
      when:
        - install_kvm | bool
        - kvm_active_nets.rc | default(1) == 0
        - "'default' not in (kvm_active_nets.stdout_lines | default([]))"
      tags: [kvm]

    - name: KVM | Check whether default network is set to autostart
      ansible.builtin.stat:
        path: /etc/libvirt/qemu/networks/autostart/default.xml
      register: kvm_autostart
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Enable autostart for the default network
      ansible.builtin.command: virsh --connect qemu:///system net-autostart default
      register: kvm_net_autostart
      changed_when: kvm_net_autostart.rc == 0
      failed_when: false
      when:
        - install_kvm | bool
        - not (kvm_autostart.stat.exists | default(true))
      tags: [kvm]

    # ------------------------------------------------------------- tailscale
    # Tailscale's published instructions install a legacy .list whose Signed-By
    # points at /usr/share/keyrings/tailscale-archive-keyring.gpg. Adopt that
    # exact path rather than /etc/apt/keyrings: a .sources naming a different
    # keyring for the same URI is the "Conflicting values set for option
    # Signed-By" hard failure the Brave block below works around. The .list is
    # then removed so the two never coexist.
    #
    # The repo URL embeds both the distro name and its codename, so unlike the
    # other repos here there is no single URI that works everywhere — see
    # tailscale_repo_distribution in group_vars/all.yml.
    - name: Tailscale | Fetch signing key
      ansible.builtin.get_url:
        url: >-
          https://pkgs.tailscale.com/stable/{{ tailscale_repo_distribution }}/{{ tailscale_repo_suite }}.noarmor.gpg
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"
      when: install_tailscale | bool
      tags: [network, tailscale]

    - name: Tailscale | Drop legacy source from the upstream instructions
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/tailscale.list
        state: absent
      when: install_tailscale | bool
      tags: [network, tailscale]

    - name: Tailscale | Configure apt repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: [deb]
        uris: "https://pkgs.tailscale.com/stable/{{ tailscale_repo_distribution }}"
        suites: ["{{ tailscale_repo_suite }}"]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /usr/share/keyrings/tailscale-archive-keyring.gpg
        state: present
        enabled: true
      register: tailscale_repo
      when: install_tailscale | bool
      tags: [network, tailscale]

    - name: Tailscale | Install
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: "{{ tailscale_repo.changed | default(false) }}"
      when: install_tailscale | bool
      tags: [network, tailscale]

    - name: Tailscale | Enable and start tailscaled
      ansible.builtin.systemd_service:
        name: tailscaled
        state: started
        enabled: true
      when: install_tailscale | bool
      tags: [network, tailscale]

    # Joining a tailnet is deliberately left to the operator: `tailscale up`
    # without a key opens a browser for interactive login, which would hang a
    # provisioning run. Set tailscale_authkey to join unattended.
    - name: Tailscale | Check whether the node is already connected
      ansible.builtin.command: tailscale status --json
      register: tailscale_status
      changed_when: false
      # Exits non-zero when logged out, which is a state to read, not an error.
      failed_when: false
      check_mode: false
      when:
        - install_tailscale | bool
        - tailscale_authkey | length > 0
      tags: [network, tailscale]

    # The two-argument default() also substitutes on an *empty* stdout, which
    # is what the probe above returns when it fails; from_json would raise on
    # the empty string.
    - name: Tailscale | Join the tailnet with an auth key
      ansible.builtin.command: >-
        tailscale up --auth-key {{ tailscale_authkey }} {{ tailscale_up_args }}
      register: tailscale_up
      changed_when: tailscale_up.rc == 0
      when:
        - install_tailscale | bool
        - tailscale_authkey | length > 0
        - (tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') != 'Running'
      no_log: true
      tags: [network, tailscale]

    # ----------------------------------------------------------------- brave
    # The brave-browser package ships its own deb822 source at
    # brave-browser-release.sources, with Signed-By pointing into
    # /usr/share/keyrings. Writing a second source for the same URI+suite under
    # a different Signed-By makes apt hard-fail with "Conflicting values set for
    # option Signed-By" and refuse to read *any* source list. So adopt Brave's
    # own paths and filename rather than competing with its postinst.
    - name: Brave | Fetch signing key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: "0644"
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Drop earlier ansible-managed duplicate source and keyring
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/brave-browser.sources
        - /etc/apt/keyrings/brave-browser.gpg
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Configure apt repository
      ansible.builtin.deb822_repository:
        name: brave-browser-release
        types: [deb]
        uris: https://brave-browser-apt-release.s3.brave.com
        suites: [stable]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        state: present
        enabled: true
      register: brave_repo
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Install browser
      ansible.builtin.apt:
        name: brave-browser
        state: present
        update_cache: "{{ brave_repo.changed | default(false) }}"
      when: install_brave | bool
      tags: [browsers, brave]

    # ---------------------------------------------------------------- chrome
    # The google-chrome-stable postinst re-adds its own apt source unless this
    # file opts out. We manage the repo ourselves, so suppress it.
    - name: Chrome | Suppress postinst repo self-registration
      ansible.builtin.copy:
        dest: /etc/default/google-chrome
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
        mode: "0644"
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Fetch signing key
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /etc/apt/keyrings/google-chrome.asc
        mode: "0644"
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Configure apt repository
      ansible.builtin.deb822_repository:
        name: google-chrome
        types: [deb]
        uris: https://dl.google.com/linux/chrome/deb/
        suites: [stable]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/google-chrome.asc
        state: present
        enabled: true
      register: chrome_repo
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Install browser
      ansible.builtin.apt:
        name: google-chrome-stable
        state: present
        update_cache: "{{ chrome_repo.changed | default(false) }}"
      when: install_chrome | bool
      tags: [browsers, chrome]

    # Safety net: if the postinst ignored the opt-out above and registered its
    # own legacy source, remove it before a later task runs apt again — two
    # keyrings for one URI is a hard apt error that would break the *next* task.
    #
    # Only ever list .list here. The deb822_repository task above writes
    # google-chrome.sources, so naming that file would delete our own repo,
    # leaving Chrome installed but unable to update.
    - name: Chrome | Remove legacy source self-registered by postinst
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/google-chrome.list
        state: absent
      when: install_chrome | bool
      tags: [browsers, chrome]

    # ---------------------------------------------------------------- vscode
    # Best-effort: mirrors Chrome's opt-out convention. If the Microsoft
    # package ignores it, the .list cleanup task further down still removes
    # any duplicate source it creates.
    - name: VSCode | Suppress postinst repo self-registration
      ansible.builtin.copy:
        dest: /etc/default/code
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
        mode: "0644"
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Fetch Microsoft signing key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: "0644"
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Configure apt repository
      ansible.builtin.deb822_repository:
        name: vscode
        types: [deb]
        uris: https://packages.microsoft.com/repos/code
        suites: [stable]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/microsoft.asc
        state: present
        enabled: true
      register: vscode_repo
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Install editor
      ansible.builtin.apt:
        name: code
        state: present
        update_cache: "{{ vscode_repo.changed | default(false) }}"
      when: install_vscode | bool
      tags: [editors, vscode]

    # Same reasoning as Chrome, including the .list-only rule: the repo task
    # above owns vscode.sources, so this must never name that file.
    - name: VSCode | Remove legacy source self-registered by postinst
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/vscode.list
        state: absent
      when: install_vscode | bool
      tags: [editors, vscode]

    # --------------------------------------------------------------- codium
    - name: Codium | Fetch signing key
      ansible.builtin.get_url:
        url: https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg
        dest: /etc/apt/keyrings/vscodium.asc
        mode: "0644"
      when: install_codium | bool
      tags: [editors, codium]

    - name: Codium | Configure apt repository
      ansible.builtin.deb822_repository:
        name: vscodium
        types: [deb]
        uris: https://download.vscodium.com/debs
        suites: [vscodium]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/vscodium.asc
        state: present
        enabled: true
      register: codium_repo
      when: install_codium | bool
      tags: [editors, codium]

    - name: Codium | Install editor
      ansible.builtin.apt:
        name: codium
        state: present
        update_cache: "{{ codium_repo.changed | default(false) }}"
      when: install_codium | bool
      tags: [editors, codium]

    # ----------------------------------------------------------- claude code
    - name: Claude Code | Fetch signing key
      ansible.builtin.get_url:
        url: https://downloads.claude.ai/keys/claude-code.asc
        dest: /etc/apt/keyrings/claude-code.asc
        mode: "0644"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Configure apt repository
      ansible.builtin.deb822_repository:
        name: claude-code
        types: [deb]
        uris: "https://downloads.claude.ai/claude-code/apt/{{ claude_code_channel }}"
        suites: ["{{ claude_code_channel }}"]
        components: [main]
        # Pinned like the other repos: left unset, apt queries this repo for
        # every foreign architecture dpkg has enabled (i386 is common, from
        # Steam or Wine) and hard-fails on the missing index.
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/claude-code.asc
        state: present
        enabled: true
      register: claude_repo
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Install from apt
      ansible.builtin.apt:
        name: claude-code
        state: present
        update_cache: "{{ claude_repo.changed | default(false) }}"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Install natively for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash -s {{ claude_code_channel }}
        executable: /bin/bash
        creates: "{{ target_user_home }}/.local/bin/claude"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'native'
      tags: [ai, claude]

    # -------------------------------------------------------------- opencode
    - name: OpenCode | Install for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://opencode.ai/install | bash
        executable: /bin/bash
        creates: "{{ target_user_home }}/.opencode/bin/opencode"
      when: install_opencode | bool
      tags: [ai, opencode]

    - name: OpenCode | Ensure ~/.opencode/bin is on PATH
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.lineinfile:
        path: "~/.profile"
        line: 'export PATH="$HOME/.opencode/bin:$PATH"'
        regexp: '^export PATH=.*\.opencode/bin'
        create: true
        mode: "0644"
      when: install_opencode | bool
      tags: [ai, opencode]

    # ---------------------------------------------------------------- hermes
    # Nous Research's Hermes Agent — a TUI coding/messaging agent. Same outward
    # shape as the Claude Code native and OpenCode installs (upstream script,
    # run as target_user, guarded with creates:) but a much heavier install
    # underneath: install.sh clones the repo to ~/.hermes/hermes-agent, builds
    # a uv venv, fetches its own Node, and writes a launcher shim — not a
    # single downloaded binary like claude, opencode and herdr.
    #
    # Upstream lists Linux x86_64 and aarch64 as tier 1 from the same URL, so
    # nothing arch-specific is needed here.
    #
    # --skip-setup is not optional. Left off, install.sh finishes by running
    # `hermes setup`, an interactive provider login that it deliberately reads
    # from /dev/tty *specifically so that piping the script does not skip it* —
    # curl | bash is not protection. Under Ansible there is normally no
    # controlling tty, so the wizard's own probe would skip it, but that is a
    # property of how the play happens to be invoked rather than anything this
    # task states. The flag makes it explicit. Run `hermes setup --portal` by
    # hand afterwards; the summary says so.
    #
    # The prerequisite list is what keeps install.sh out of apt. It shells out
    # to `sudo apt-get install` for anything missing — git, ripgrep, ffmpeg,
    # libatomic1 (Node's official builds link it and Ubuntu does not always
    # ship it) — and when sudo needs a password it tries to prompt. Installing
    # them first means every one of those probes finds its package and returns
    # without escalating, so apt stays this playbook's job. None is guaranteed
    # otherwise: only ca-certificates, curl and gnupg are unconditional, and
    # git is behind its own toggle, so this is also what makes install_hermes
    # work with install_git false. apt is idempotent, so it is a no-op when the
    # Git task above already ran. xz-utils is needed to unpack the Node tarball.
    # build-essential is the one install.sh cannot recover from: it compiles
    # node-pty natively, and with no C++ compiler present its own
    # `sudo apt install build-essential` fallback prompts for a password,
    # fails unattended, and the run exits 1 several steps later.
    #
    # KNOWN SIDE EFFECT, and it now collides with install_nodejs: install.sh
    # also symlinks its vendored node, npm and npx into ~/.local/bin. That
    # directory precedes /usr/bin on Ubuntu's stock ~/.profile PATH, so with
    # both toggles on, Hermes's bundled Node — not the NodeSource one this play
    # installs — is what `node` and `npm` resolve to for target_user. apt still
    # owns /usr/bin/node, and root's PATH is unaffected, so nothing breaks; the
    # user's shell just gets a different version than nodejs_major says. The
    # summary at the end of the run points this out when both are selected.
    #
    # Three ways out, none of them worth doing by default: turn off
    # install_hermes, turn off install_nodejs and let Hermes's copy be the
    # machine's Node, or delete the three symlinks by hand after the run —
    # Hermes calls its own node by absolute path and does not need them.
    - name: Hermes | Install prerequisites
      ansible.builtin.apt:
        name:
          - git
          - xz-utils
          - build-essential
          - ripgrep
          - ffmpeg
          - libatomic1
        state: present
      when: install_hermes | bool
      tags: [ai, hermes]

    # Guarded on the launcher rather than on install.sh's own completion marker
    # (~/.hermes/hermes-agent/.hermes-bootstrap-complete). The marker is the
    # stronger signal — it is written last, and only after a fully successful
    # run — but install.sh skips writing it rather than failing when it cannot
    # resolve the checkout's HEAD, and a guard that can be legitimately absent
    # re-runs the installer on every play and reports changed forever. The
    # launcher matches how claude, opencode and herdr are guarded here. The
    # cost is that it is written a few steps before the end, so an install
    # interrupted in those last steps looks complete: delete
    # ~/.local/bin/hermes to force a clean retry.
    - name: Hermes | Install for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh
          | bash -s -- --skip-setup
        executable: /bin/bash
        creates: "{{ target_user_home }}/.local/bin/hermes"
      when: install_hermes | bool
      tags: [ai, hermes]

    # ----------------------------------------------------------------- herdr
    # Same shape as the Claude Code native install: an upstream script that
    # drops a single binary in ~/.local/bin and updates itself from then on
    # (`herdr update`), so it runs as target_user rather than root and is
    # guarded with creates: to keep it a one-off.
    #
    # No PATH task, unlike OpenCode: ~/.local/bin is what Ubuntu's stock
    # ~/.profile already adds, and it is where claude lives too.
    #
    # The installer covers linux x86_64 and aarch64 — the same two the
    # architecture assert allows — and verifies a SHA-256 from the release
    # manifest before installing.
    - name: Herdr | Install for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://herdr.dev/install.sh | sh
        executable: /bin/bash
        creates: "{{ target_user_home }}/.local/bin/herdr"
      when: install_herdr | bool
      tags: [ai, herdr]

    # -------------------------------------------------------------- graphify
    # Installed with pipx, matching .devcontainer/install-graphify.sh. A plain
    # `pip install` is not an option: Ubuntu's python is PEP 668
    # externally-managed and refuses, and --break-system-packages puts ~25
    # dependencies (networkx, numpy, a tree-sitter grammar per language) on top
    # of the system interpreter to get one CLI. pipx gives each its own venv and
    # links the entry points into ~/.local/bin, which is already where claude
    # and herdr live and what Ubuntu's stock ~/.profile puts on PATH.
    #
    # pipx itself comes from the archive rather than pip, for the same PEP 668
    # reason — it is the one piece that has to exist before anything else can be
    # installed this way.
    #
    # This deliberately does not run `graphify install`, the vendor's skill
    # installer: it writes a /graphify SKILL.md into ~/.claude/skills, appends a
    # registration block to ~/.claude/CLAUDE.md and registers a PreToolUse hook,
    # all of which would sit beside the /graphify-update skill and Code Graph
    # rules this workspace already carries. The CLI is the part the machine
    # needs. Run it by hand if you want the vendor skill layer too.
    - name: Graphify | Install pipx
      ansible.builtin.apt:
        name: pipx
        state: present
      when: install_graphify | bool
      tags: [ai, graphify]

    # `pipx list --short` prints one "<package> <version>" line per install, so
    # it answers both questions at once: whether this graphify is the pipx one
    # and whether it is the pinned version. `graphify --version` would answer
    # only the second, and would happily accept a hand-rolled venv on PATH — the
    # playbook would then report success while the machine did not match what it
    # describes. This box is exactly that case: a ~/.venvs/graphifyy built by
    # hand, at the pinned version, which a version-only guard would leave alone
    # forever.
    #
    # failed_when: false covers the first run, where pipx does not exist yet in
    # check mode and the probe cannot run at all.
    - name: Graphify | Check for a pipx-managed install
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.command: pipx list --short
      register: graphify_pipx
      changed_when: false
      failed_when: false
      check_mode: false
      when: install_graphify | bool
      tags: [ai, graphify]

    # --force rather than a bare install: pipx refuses when the package is
    # already present, which would turn an upgrade into a failure instead of
    # putting the pinned version in place. It is also what lets this adopt an
    # existing hand-made install — the entry points in ~/.local/bin get
    # repointed at the pipx venv, leaving the old one on disk, unused and safe
    # to delete by hand.
    - name: Graphify | Install graphifyy {{ graphify_version }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: pipx install --force "graphifyy=={{ graphify_version }}"
        executable: /bin/bash
      when:
        - install_graphify | bool
        - "'graphifyy ' ~ graphify_version not in (graphify_pipx.stdout | default(''))"
      tags: [ai, graphify]

    # --------------------------------------------------------------- secrets
    # The `age` package ships both `age` and `age-keygen`. Nothing here
    # configures either tool: generate a key with
    # `age-keygen -o ~/.config/sops/age/keys.txt`, which is where SOPS looks by
    # default.
    - name: age | Install
      ansible.builtin.apt:
        name: age
        state: present
      when: install_age | bool
      tags: [secrets, age]

    # SOPS is the one component here that comes from a direct URL rather than a
    # repo: upstream publishes no apt repo, and the archive's only match for the
    # name is `orca-sops`, an unrelated GNOME package. See group_vars/all.yml.
    #
    # check_mode: false for the same reason as the probes above — this only
    # reads, and skipping it would leave sops_resolved_version undefined and
    # fail the dry run at the task after next.
    - name: SOPS | Resolve the latest release
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ sops_github_repo }}/releases/latest"
        return_content: true
      register: sops_latest
      check_mode: false
      when:
        - install_sops | bool
        - sops_version == 'latest'
      tags: [secrets, sops]

    - name: SOPS | Record the version to install
      ansible.builtin.set_fact:
        sops_resolved_version: >-
          {{ (sops_latest.json.tag_name | regex_replace('^v', ''))
             if sops_version == 'latest'
             else sops_version }}
      when: install_sops | bool
      tags: [secrets, sops]

    # --disable-version-check is not optional here: without it `sops --version`
    # queries GitHub to compare against the newest release and appends its
    # verdict to the line, which both adds a network round trip to every play
    # and puts a second version number into the string matched below.
    - name: SOPS | Check which version is installed
      ansible.builtin.command: sops --version --disable-version-check
      register: sops_installed
      changed_when: false
      # Non-zero here means "not installed yet", which is a state to read.
      failed_when: false
      check_mode: false
      when: install_sops | bool
      tags: [secrets, sops]

    # Matched against the whitespace-split tokens rather than as a substring:
    # "3.1" occurs inside "3.13.3", and a substring test would silently decide
    # an older SOPS was already the requested one.
    - name: SOPS | Install {{ sops_resolved_version | default('') }} from the release .deb
      ansible.builtin.apt:
        deb: >-
          https://github.com/{{ sops_github_repo }}/releases/download/v{{ sops_resolved_version }}/sops_{{ sops_resolved_version }}_{{ deb_arch }}.deb
      when:
        - install_sops | bool
        - sops_resolved_version not in (sops_installed.stdout | default('')).split()
      tags: [secrets, sops]

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Docker/KVM group membership does not apply to existing sessions."
          - "Log out and back in (or run: newgrp docker) before using docker without sudo."
          - "Authenticate Claude Code by running: claude"
          - "{{ 'Hermes is installed but not configured; pick an LLM provider with: hermes setup --portal'
                if (install_hermes | bool)
                else 'Hermes: not installed.' }}"
          - "{{ 'Rust and Go reach PATH only in a new login shell - rustup writes ~/.cargo/env, '
                ~ 'Go comes from ' ~ go_profile_script ~ '.'
                if (install_rust | bool) or (install_go | bool)
                else 'Rust/Go: not installed.' }}"
          - "{{ 'Hermes symlinks its own node/npm into ~/.local/bin, which precedes /usr/bin: '
                ~ 'your shell gets that Node, not the NodeSource one. Delete those three symlinks '
                ~ 'to prefer NodeSource; Hermes calls its own by absolute path and does not need them.'
                if (install_hermes | bool) and (install_nodejs | bool)
                else 'Node: no Hermes/NodeSource PATH conflict.' }}"
          - "{{ 'Tailscale is installed but not connected; join a tailnet with: sudo tailscale up'
                if (install_tailscale | bool) and (tailscale_authkey | length == 0)
                else 'Tailscale: connected (or an auth key was supplied).' }}"
          - "{{ 'SOPS has no key yet; make one with: age-keygen -o ~/.config/sops/age/keys.txt'
                if (install_sops | bool) and (install_age | bool)
                else 'SOPS/age: not both installed, so no key hint applies.' }}"
