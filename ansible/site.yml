---
- name: Provision developer workstation
  hosts: workstation
  become: true
  gather_facts: true

  pre_tasks:
    - name: Fail early on unsupported platforms
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
          - ansible_architecture == 'x86_64'
        fail_msg: >-
          This playbook targets Debian/Ubuntu on x86_64. Detected
          {{ ansible_distribution }} {{ ansible_distribution_version }} on
          {{ ansible_architecture }}. The third-party apt repos referenced here
          publish amd64 only in the form used below.
      tags: always

    - name: Resolve target user
      ansible.builtin.assert:
        that:
          - target_user | length > 0
          - target_user != 'root'
        fail_msg: >-
          target_user resolved to '{{ target_user }}'. Set it explicitly, e.g.
          -e target_user=ahill
      tags: always

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: always

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      tags: always

  tasks:
    # ------------------------------------------------------------------ base
    - name: Install Git
      ansible.builtin.apt:
        name: git
        state: present
      when: install_git | bool
      tags: [base, git]

    - name: Install btop
      ansible.builtin.apt:
        name: btop
        state: present
      when: install_btop | bool
      tags: [base, btop]

    # ---------------------------------------------------------------- docker
    - name: Docker | Purge distro-packaged versions
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: true
      when:
        - install_docker | bool
        - docker_purge_distro_packages | bool
      tags: [docker]

    - name: Docker | Fetch signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Configure apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true
      register: docker_repo
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Install engine, CLI and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repo.changed | default(false) }}"
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Enable and start service
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Add {{ target_user }} to docker group
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true
      when:
        - install_docker | bool
        - docker_add_user_to_group | bool
      tags: [docker]

    # ------------------------------------------------------------------- kvm
    - name: KVM | Check for hardware virtualization
      ansible.builtin.command: grep -Ecm1 '(vmx|svm)' /proc/cpuinfo
      register: kvm_flags
      changed_when: false
      failed_when: false
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Warn if hardware virtualization is unavailable
      ansible.builtin.debug:
        msg: >-
          No vmx/svm flag in /proc/cpuinfo. Packages will still install, but
          guests will fall back to slow software emulation. Check that
          virtualization is enabled in firmware/BIOS.
      when:
        - install_kvm | bool
        - kvm_flags.rc | default(1) != 0
      tags: [kvm]

    - name: KVM | Install libvirt and QEMU
      ansible.builtin.apt:
        name:
          # Not 'qemu-kvm': that is a virtual package here, provided by both
          # qemu-system-x86 and qemu-system-x86-hwe, and apt refuses to choose
          # between providers ("has no installation candidate"). Name the real
          # package. The -hwe variant tracks a newer QEMU on LTS; the plain one
          # is the standard choice.
          - qemu-system-x86
          - qemu-utils
          - libvirt-daemon-system
          - libvirt-daemon-config-network
          - libvirt-clients
          - virtinst
          - virt-manager
          - bridge-utils
          - ovmf
        state: present
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Enable and start libvirtd
      ansible.builtin.systemd_service:
        name: libvirtd
        state: started
        enabled: true
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Add {{ target_user }} to libvirt and kvm groups
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: [libvirt, kvm]
        append: true
      when: install_kvm | bool
      tags: [kvm]

    # Done with virsh rather than community.libvirt so the playbook needs
    # nothing beyond ansible-core. Both steps are guarded so they only report
    # changed when they actually do something.
    - name: KVM | List currently active libvirt networks
      ansible.builtin.command: virsh --connect qemu:///system net-list --name
      register: kvm_active_nets
      changed_when: false
      failed_when: false
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Start the default network
      ansible.builtin.command: virsh --connect qemu:///system net-start default
      register: kvm_net_start
      changed_when: kvm_net_start.rc == 0
      failed_when: false
      when:
        - install_kvm | bool
        - kvm_active_nets.rc | default(1) == 0
        - "'default' not in (kvm_active_nets.stdout_lines | default([]))"
      tags: [kvm]

    - name: KVM | Check whether default network is set to autostart
      ansible.builtin.stat:
        path: /etc/libvirt/qemu/networks/autostart/default.xml
      register: kvm_autostart
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Enable autostart for the default network
      ansible.builtin.command: virsh --connect qemu:///system net-autostart default
      register: kvm_net_autostart
      changed_when: kvm_net_autostart.rc == 0
      failed_when: false
      when:
        - install_kvm | bool
        - not (kvm_autostart.stat.exists | default(true))
      tags: [kvm]

    # ----------------------------------------------------------------- brave
    # The brave-browser package ships its own deb822 source at
    # brave-browser-release.sources, with Signed-By pointing into
    # /usr/share/keyrings. Writing a second source for the same URI+suite under
    # a different Signed-By makes apt hard-fail with "Conflicting values set for
    # option Signed-By" and refuse to read *any* source list. So adopt Brave's
    # own paths and filename rather than competing with its postinst.
    - name: Brave | Fetch signing key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: "0644"
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Drop earlier ansible-managed duplicate source and keyring
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/brave-browser.sources
        - /etc/apt/keyrings/brave-browser.gpg
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Configure apt repository
      ansible.builtin.deb822_repository:
        name: brave-browser-release
        types: [deb]
        uris: https://brave-browser-apt-release.s3.brave.com
        suites: [stable]
        components: [main]
        architectures: [amd64]
        signed_by: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        state: present
        enabled: true
      register: brave_repo
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Install browser
      ansible.builtin.apt:
        name: brave-browser
        state: present
        update_cache: "{{ brave_repo.changed | default(false) }}"
      when: install_brave | bool
      tags: [browsers, brave]

    # ---------------------------------------------------------------- chrome
    # The google-chrome-stable postinst re-adds its own apt source unless this
    # file opts out. We manage the repo ourselves, so suppress it.
    - name: Chrome | Suppress postinst repo self-registration
      ansible.builtin.copy:
        dest: /etc/default/google-chrome
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
        mode: "0644"
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Fetch signing key
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /etc/apt/keyrings/google-chrome.asc
        mode: "0644"
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Configure apt repository
      ansible.builtin.deb822_repository:
        name: google-chrome
        types: [deb]
        uris: https://dl.google.com/linux/chrome/deb/
        suites: [stable]
        components: [main]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/google-chrome.asc
        state: present
        enabled: true
      register: chrome_repo
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Install browser
      ansible.builtin.apt:
        name: google-chrome-stable
        state: present
        update_cache: "{{ chrome_repo.changed | default(false) }}"
      when: install_chrome | bool
      tags: [browsers, chrome]

    # Safety net: if the postinst ignored the opt-out above and registered its
    # own legacy source, remove it before a later task runs apt again — two
    # keyrings for one URI is a hard apt error that would break the *next* task.
    #
    # Only ever list .list here. The deb822_repository task above writes
    # google-chrome.sources, so naming that file would delete our own repo,
    # leaving Chrome installed but unable to update.
    - name: Chrome | Remove legacy source self-registered by postinst
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/google-chrome.list
        state: absent
      when: install_chrome | bool
      tags: [browsers, chrome]

    # ---------------------------------------------------------------- vscode
    # Best-effort: mirrors Chrome's opt-out convention. If the Microsoft
    # package ignores it, the .list cleanup task further down still removes
    # any duplicate source it creates.
    - name: VSCode | Suppress postinst repo self-registration
      ansible.builtin.copy:
        dest: /etc/default/code
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
        mode: "0644"
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Fetch Microsoft signing key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: "0644"
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Configure apt repository
      ansible.builtin.deb822_repository:
        name: vscode
        types: [deb]
        uris: https://packages.microsoft.com/repos/code
        suites: [stable]
        components: [main]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/microsoft.asc
        state: present
        enabled: true
      register: vscode_repo
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Install editor
      ansible.builtin.apt:
        name: code
        state: present
        update_cache: "{{ vscode_repo.changed | default(false) }}"
      when: install_vscode | bool
      tags: [editors, vscode]

    # Same reasoning as Chrome, including the .list-only rule: the repo task
    # above owns vscode.sources, so this must never name that file.
    - name: VSCode | Remove legacy source self-registered by postinst
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/vscode.list
        state: absent
      when: install_vscode | bool
      tags: [editors, vscode]

    # --------------------------------------------------------------- codium
    - name: Codium | Fetch signing key
      ansible.builtin.get_url:
        url: https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg
        dest: /etc/apt/keyrings/vscodium.asc
        mode: "0644"
      when: install_codium | bool
      tags: [editors, codium]

    - name: Codium | Configure apt repository
      ansible.builtin.deb822_repository:
        name: vscodium
        types: [deb]
        uris: https://download.vscodium.com/debs
        suites: [vscodium]
        components: [main]
        architectures: [amd64]
        signed_by: /etc/apt/keyrings/vscodium.asc
        state: present
        enabled: true
      register: codium_repo
      when: install_codium | bool
      tags: [editors, codium]

    - name: Codium | Install editor
      ansible.builtin.apt:
        name: codium
        state: present
        update_cache: "{{ codium_repo.changed | default(false) }}"
      when: install_codium | bool
      tags: [editors, codium]

    # ----------------------------------------------------------- claude code
    - name: Claude Code | Fetch signing key
      ansible.builtin.get_url:
        url: https://downloads.claude.ai/keys/claude-code.asc
        dest: /etc/apt/keyrings/claude-code.asc
        mode: "0644"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Configure apt repository
      ansible.builtin.deb822_repository:
        name: claude-code
        types: [deb]
        uris: "https://downloads.claude.ai/claude-code/apt/{{ claude_code_channel }}"
        suites: ["{{ claude_code_channel }}"]
        components: [main]
        signed_by: /etc/apt/keyrings/claude-code.asc
        state: present
        enabled: true
      register: claude_repo
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Install from apt
      ansible.builtin.apt:
        name: claude-code
        state: present
        update_cache: "{{ claude_repo.changed | default(false) }}"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Install natively for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash -s {{ claude_code_channel }}
        executable: /bin/bash
        creates: "~/.local/bin/claude"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'native'
      tags: [ai, claude]

    # -------------------------------------------------------------- opencode
    - name: OpenCode | Install for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://opencode.ai/install | bash
        executable: /bin/bash
        creates: "~/.opencode/bin/opencode"
      when: install_opencode | bool
      tags: [ai, opencode]

    - name: OpenCode | Ensure ~/.opencode/bin is on PATH
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.lineinfile:
        path: "~/.profile"
        line: 'export PATH="$HOME/.opencode/bin:$PATH"'
        regexp: '^export PATH=.*\.opencode/bin'
        create: true
        mode: "0644"
      when: install_opencode | bool
      tags: [ai, opencode]

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Docker/KVM group membership does not apply to existing sessions."
          - "Log out and back in (or run: newgrp docker) before using docker without sudo."
          - "Authenticate Claude Code by running: claude"
