---
- name: Provision developer workstation
  hosts: workstation
  become: true
  gather_facts: true

  pre_tasks:
    - name: Fail early on unsupported distributions
      ansible.builtin.assert:
        that: ansible_os_family == 'Debian'
        fail_msg: >-
          This playbook targets Debian/Ubuntu. Detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_os_family }} family).
      tags: always

    # apt speaks dpkg architecture names (amd64, arm64); the kernel — and so
    # ansible_architecture — speaks x86_64 and aarch64. The two never match, and
    # mapping between them here would be guesswork: a 32-bit userland on a
    # 64-bit kernel reports aarch64 while apt resolves armhf. Ask dpkg, which is
    # the same thing apt itself consults.
    - name: Detect dpkg architecture
      ansible.builtin.command: dpkg --print-architecture
      register: dpkg_arch_probe
      changed_when: false
      tags: always

    - name: Record dpkg architecture
      ansible.builtin.set_fact:
        deb_arch: "{{ dpkg_arch_probe.stdout | trim }}"
      tags: always

    - name: Fail early on unsupported architectures
      ansible.builtin.assert:
        that: deb_arch in supported_deb_architectures
        fail_msg: >-
          Architecture '{{ deb_arch }}' is not in supported_deb_architectures
          ({{ supported_deb_architectures | join(', ') }}). The third-party apt
          repos configured below publish those two; on anything else the repo
          indices 404 and the run fails partway through.
      tags: always

    - name: Resolve target user
      ansible.builtin.assert:
        that:
          - target_user | length > 0
          - target_user != 'root'
        fail_msg: >-
          target_user resolved to '{{ target_user }}'. Set it explicitly, e.g.
          -e target_user=ahill
      tags: always

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: always

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      tags: always

  tasks:
    # ------------------------------------------------------------------ base
    - name: Install Git
      ansible.builtin.apt:
        name: git
        state: present
      when: install_git | bool
      tags: [base, git]

    - name: Install btop
      ansible.builtin.apt:
        name: btop
        state: present
      when: install_btop | bool
      tags: [base, btop]

    # -------------------------------------------------------------- appimage
    # AppImages (LM Studio, Cursor, ...) dlopen libfuse.so.2 on startup and
    # abort with "dlopen(): error loading libfuse.so.2" when it is missing —
    # nothing pulls it in by default since the archive moved to FUSE 3.
    #
    # Ubuntu's 64-bit time_t transition renamed libfuse2 -> libfuse2t64 in
    # 24.04, so the name depends on the release. Probe the cache rather than
    # branch on ansible_distribution_version: those numbers are not comparable
    # across the derivatives this may run on (Mint 22 *is* Ubuntu 24.04, but
    # reports 22). The pre_tasks apt update above makes the cache current.
    - name: AppImage | Detect FUSE 2 package name
      ansible.builtin.command: apt-cache policy libfuse2t64
      register: fuse2t64_policy
      changed_when: false
      failed_when: false
      when: install_appimage_support | bool
      tags: [base, appimage]

    # apt-cache policy exits 0 with empty stdout for an unknown package, so
    # presence of output — not rc — is the signal.
    - name: AppImage | Install FUSE 2 runtime
      ansible.builtin.apt:
        name: "{{ 'libfuse2t64' if (fuse2t64_policy.stdout | default('') | trim | length > 0) else 'libfuse2' }}"
        state: present
      when: install_appimage_support | bool
      tags: [base, appimage]

    # ---------------------------------------------------------------- docker
    - name: Docker | Purge distro-packaged versions
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-doc
          - docker-compose
          - docker-compose-v2
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: true
      when:
        - install_docker | bool
        - docker_purge_distro_packages | bool
      tags: [docker]

    - name: Docker | Fetch signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Configure apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: https://download.docker.com/linux/ubuntu
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/docker.asc
        state: present
        enabled: true
      register: docker_repo
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Install engine, CLI and plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: "{{ docker_repo.changed | default(false) }}"
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Enable and start service
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
      when: install_docker | bool
      tags: [docker]

    - name: Docker | Add {{ target_user }} to docker group
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: docker
        append: true
      when:
        - install_docker | bool
        - docker_add_user_to_group | bool
      tags: [docker]

    # ------------------------------------------------------------------- kvm
    # x86 advertises virtualization through the vmx/svm cpu flag. arm64 has no
    # equivalent: KVM there depends on the kernel having been entered at EL2,
    # which is the firmware's decision and is not reported in /proc/cpuinfo at
    # all. The honest signal on arm64 is whether the kernel exposed /dev/kvm,
    # which it does independently of the packages installed below.
    - name: KVM | Check for the virtualization cpu flag (x86)
      ansible.builtin.command: grep -Ecm1 '(vmx|svm)' /proc/cpuinfo
      register: kvm_flags
      changed_when: false
      failed_when: false
      when:
        - install_kvm | bool
        - deb_arch == 'amd64'
      tags: [kvm]

    - name: KVM | Check for /dev/kvm (non-x86)
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_dev
      when:
        - install_kvm | bool
        - deb_arch != 'amd64'
      tags: [kvm]

    - name: KVM | Record whether hardware virtualization is available
      ansible.builtin.set_fact:
        kvm_hw_available: >-
          {{ (kvm_flags.rc | default(1)) == 0
             if deb_arch == 'amd64'
             else (kvm_dev.stat.exists | default(false)) }}
      when: install_kvm | bool
      tags: [kvm]

    # Each hint is its own folded scalar rather than a multi-line literal inside
    # the ternary: YAML keeps the newlines of a more-indented continuation line,
    # which would print the message pre-broken across lines.
    - name: KVM | Warn if hardware virtualization is unavailable
      vars:
        kvm_hint:
          amd64: >-
            No vmx/svm flag in /proc/cpuinfo; check that virtualization is
            enabled in firmware/BIOS.
          other: >-
            No /dev/kvm. On arm64 this usually means the kernel was not entered
            at EL2, which is a firmware/bootloader decision rather than anything
            the OS can change.
      ansible.builtin.debug:
        msg: >-
          {{ kvm_hint[deb_arch] | default(kvm_hint['other']) }}
          Packages will still install, but guests will fall back to slow
          software emulation.
      when:
        - install_kvm | bool
        - not (kvm_hw_available | bool)
      tags: [kvm]

    # Emulator and guest firmware come from kvm_packages_by_arch; see
    # group_vars/all.yml for why the amd64 entry names qemu-system-x86 rather
    # than the qemu-kvm virtual package.
    - name: KVM | Install libvirt and QEMU
      ansible.builtin.apt:
        name: "{{ kvm_packages_common + kvm_packages_by_arch[deb_arch] }}"
        state: present
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Enable and start libvirtd
      ansible.builtin.systemd_service:
        name: libvirtd
        state: started
        enabled: true
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Add {{ target_user }} to libvirt and kvm groups
      ansible.builtin.user:
        name: "{{ target_user }}"
        groups: [libvirt, kvm]
        append: true
      when: install_kvm | bool
      tags: [kvm]

    # Done with virsh rather than community.libvirt so the playbook needs
    # nothing beyond ansible-core. Both steps are guarded so they only report
    # changed when they actually do something.
    - name: KVM | List currently active libvirt networks
      ansible.builtin.command: virsh --connect qemu:///system net-list --name
      register: kvm_active_nets
      changed_when: false
      failed_when: false
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Start the default network
      ansible.builtin.command: virsh --connect qemu:///system net-start default
      register: kvm_net_start
      changed_when: kvm_net_start.rc == 0
      failed_when: false
      when:
        - install_kvm | bool
        - kvm_active_nets.rc | default(1) == 0
        - "'default' not in (kvm_active_nets.stdout_lines | default([]))"
      tags: [kvm]

    - name: KVM | Check whether default network is set to autostart
      ansible.builtin.stat:
        path: /etc/libvirt/qemu/networks/autostart/default.xml
      register: kvm_autostart
      when: install_kvm | bool
      tags: [kvm]

    - name: KVM | Enable autostart for the default network
      ansible.builtin.command: virsh --connect qemu:///system net-autostart default
      register: kvm_net_autostart
      changed_when: kvm_net_autostart.rc == 0
      failed_when: false
      when:
        - install_kvm | bool
        - not (kvm_autostart.stat.exists | default(true))
      tags: [kvm]

    # ----------------------------------------------------------------- brave
    # The brave-browser package ships its own deb822 source at
    # brave-browser-release.sources, with Signed-By pointing into
    # /usr/share/keyrings. Writing a second source for the same URI+suite under
    # a different Signed-By makes apt hard-fail with "Conflicting values set for
    # option Signed-By" and refuse to read *any* source list. So adopt Brave's
    # own paths and filename rather than competing with its postinst.
    - name: Brave | Fetch signing key
      ansible.builtin.get_url:
        url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
        dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        mode: "0644"
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Drop earlier ansible-managed duplicate source and keyring
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/brave-browser.sources
        - /etc/apt/keyrings/brave-browser.gpg
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Configure apt repository
      ansible.builtin.deb822_repository:
        name: brave-browser-release
        types: [deb]
        uris: https://brave-browser-apt-release.s3.brave.com
        suites: [stable]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /usr/share/keyrings/brave-browser-archive-keyring.gpg
        state: present
        enabled: true
      register: brave_repo
      when: install_brave | bool
      tags: [browsers, brave]

    - name: Brave | Install browser
      ansible.builtin.apt:
        name: brave-browser
        state: present
        update_cache: "{{ brave_repo.changed | default(false) }}"
      when: install_brave | bool
      tags: [browsers, brave]

    # ---------------------------------------------------------------- chrome
    # The google-chrome-stable postinst re-adds its own apt source unless this
    # file opts out. We manage the repo ourselves, so suppress it.
    - name: Chrome | Suppress postinst repo self-registration
      ansible.builtin.copy:
        dest: /etc/default/google-chrome
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
        mode: "0644"
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Fetch signing key
      ansible.builtin.get_url:
        url: https://dl.google.com/linux/linux_signing_key.pub
        dest: /etc/apt/keyrings/google-chrome.asc
        mode: "0644"
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Configure apt repository
      ansible.builtin.deb822_repository:
        name: google-chrome
        types: [deb]
        uris: https://dl.google.com/linux/chrome/deb/
        suites: [stable]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/google-chrome.asc
        state: present
        enabled: true
      register: chrome_repo
      when: install_chrome | bool
      tags: [browsers, chrome]

    - name: Chrome | Install browser
      ansible.builtin.apt:
        name: google-chrome-stable
        state: present
        update_cache: "{{ chrome_repo.changed | default(false) }}"
      when: install_chrome | bool
      tags: [browsers, chrome]

    # Safety net: if the postinst ignored the opt-out above and registered its
    # own legacy source, remove it before a later task runs apt again — two
    # keyrings for one URI is a hard apt error that would break the *next* task.
    #
    # Only ever list .list here. The deb822_repository task above writes
    # google-chrome.sources, so naming that file would delete our own repo,
    # leaving Chrome installed but unable to update.
    - name: Chrome | Remove legacy source self-registered by postinst
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/google-chrome.list
        state: absent
      when: install_chrome | bool
      tags: [browsers, chrome]

    # ---------------------------------------------------------------- vscode
    # Best-effort: mirrors Chrome's opt-out convention. If the Microsoft
    # package ignores it, the .list cleanup task further down still removes
    # any duplicate source it creates.
    - name: VSCode | Suppress postinst repo self-registration
      ansible.builtin.copy:
        dest: /etc/default/code
        content: |
          repo_add_once="false"
          repo_reenable_on_distupgrade="false"
        mode: "0644"
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Fetch Microsoft signing key
      ansible.builtin.get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: "0644"
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Configure apt repository
      ansible.builtin.deb822_repository:
        name: vscode
        types: [deb]
        uris: https://packages.microsoft.com/repos/code
        suites: [stable]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/microsoft.asc
        state: present
        enabled: true
      register: vscode_repo
      when: install_vscode | bool
      tags: [editors, vscode]

    - name: VSCode | Install editor
      ansible.builtin.apt:
        name: code
        state: present
        update_cache: "{{ vscode_repo.changed | default(false) }}"
      when: install_vscode | bool
      tags: [editors, vscode]

    # Same reasoning as Chrome, including the .list-only rule: the repo task
    # above owns vscode.sources, so this must never name that file.
    - name: VSCode | Remove legacy source self-registered by postinst
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/vscode.list
        state: absent
      when: install_vscode | bool
      tags: [editors, vscode]

    # --------------------------------------------------------------- codium
    - name: Codium | Fetch signing key
      ansible.builtin.get_url:
        url: https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg
        dest: /etc/apt/keyrings/vscodium.asc
        mode: "0644"
      when: install_codium | bool
      tags: [editors, codium]

    - name: Codium | Configure apt repository
      ansible.builtin.deb822_repository:
        name: vscodium
        types: [deb]
        uris: https://download.vscodium.com/debs
        suites: [vscodium]
        components: [main]
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/vscodium.asc
        state: present
        enabled: true
      register: codium_repo
      when: install_codium | bool
      tags: [editors, codium]

    - name: Codium | Install editor
      ansible.builtin.apt:
        name: codium
        state: present
        update_cache: "{{ codium_repo.changed | default(false) }}"
      when: install_codium | bool
      tags: [editors, codium]

    # ----------------------------------------------------------- claude code
    - name: Claude Code | Fetch signing key
      ansible.builtin.get_url:
        url: https://downloads.claude.ai/keys/claude-code.asc
        dest: /etc/apt/keyrings/claude-code.asc
        mode: "0644"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Configure apt repository
      ansible.builtin.deb822_repository:
        name: claude-code
        types: [deb]
        uris: "https://downloads.claude.ai/claude-code/apt/{{ claude_code_channel }}"
        suites: ["{{ claude_code_channel }}"]
        components: [main]
        # Pinned like the other repos: left unset, apt queries this repo for
        # every foreign architecture dpkg has enabled (i386 is common, from
        # Steam or Wine) and hard-fails on the missing index.
        architectures: ["{{ deb_arch }}"]
        signed_by: /etc/apt/keyrings/claude-code.asc
        state: present
        enabled: true
      register: claude_repo
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Install from apt
      ansible.builtin.apt:
        name: claude-code
        state: present
        update_cache: "{{ claude_repo.changed | default(false) }}"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'apt'
      tags: [ai, claude]

    - name: Claude Code | Install natively for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash -s {{ claude_code_channel }}
        executable: /bin/bash
        creates: "~/.local/bin/claude"
      when:
        - install_claude_code | bool
        - claude_code_install_method == 'native'
      tags: [ai, claude]

    # -------------------------------------------------------------- opencode
    - name: OpenCode | Install for {{ target_user }}
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.shell:
        cmd: set -o pipefail && curl -fsSL https://opencode.ai/install | bash
        executable: /bin/bash
        creates: "~/.opencode/bin/opencode"
      when: install_opencode | bool
      tags: [ai, opencode]

    - name: OpenCode | Ensure ~/.opencode/bin is on PATH
      become: true
      become_user: "{{ target_user }}"
      ansible.builtin.lineinfile:
        path: "~/.profile"
        line: 'export PATH="$HOME/.opencode/bin:$PATH"'
        regexp: '^export PATH=.*\.opencode/bin'
        create: true
        mode: "0644"
      when: install_opencode | bool
      tags: [ai, opencode]

  post_tasks:
    - name: Summary
      ansible.builtin.debug:
        msg:
          - "Docker/KVM group membership does not apply to existing sessions."
          - "Log out and back in (or run: newgrp docker) before using docker without sudo."
          - "Authenticate Claude Code by running: claude"
