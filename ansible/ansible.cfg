[defaults]
inventory = inventory.ini
nocows = 1
interpreter_python = auto_silent
deprecation_warnings = False

# YAML-formatted output via ansible-core's own default callback. The old
# 'stdout_callback = yaml' pointed at community.general.yaml, which was removed
# in community.general 12.0.0.
[callback_default]
result_format = yaml
pretty_results = true

[privilege_escalation]
become = False

# Ask for the sudo password by default, so
#
#   ansible-playbook site.yml
#
# is correct on its own. Without this, become falls back to `sudo -n` and a
# standalone run with no cached credential fails every task with "sudo: a
# password is required" — which is a worse default than prompting, because the
# remedy (remembering -K) is invisible from the error.
#
# bootstrap.sh opts back out with ANSIBLE_BECOME_ASK_PASS=False once it has
# primed the sudo timestamp itself, which is what keeps that path to a single
# password prompt.
become_ask_pass = True

# become_exe deliberately lives in group_vars/all.yml, not here: the binary to
# use depends on the release, and ansible.cfg cannot express a conditional.
# See ansible_become_exe there.
