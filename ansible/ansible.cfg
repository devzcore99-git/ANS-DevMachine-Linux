[defaults]
inventory = inventory.ini
nocows = 1
interpreter_python = auto_silent
deprecation_warnings = False

# YAML-formatted output via ansible-core's own default callback. The old
# 'stdout_callback = yaml' pointed at community.general.yaml, which was removed
# in community.general 12.0.0.
[callback_default]
result_format = yaml
pretty_results = true

[privilege_escalation]
become = False

# Ubuntu 25.10+ makes sudo-rs the default behind /usr/bin/sudo. It ignores the
# custom prompt Ansible passes with -p, wrapping it as
#   [sudo: <ansible prompt>] Password:
# so Ansible never matches its own prompt and every task dies with "Timed out
# waiting for become success or become password prompt".
#
# Classic sudo is still installed as /usr/bin/sudo.ws (update-alternatives,
# priority 40). Point become at it directly rather than switching the system
# alternative, so nothing outside Ansible changes behaviour.
become_exe = /usr/bin/sudo.ws
