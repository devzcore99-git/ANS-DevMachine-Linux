---
# The unprivileged account that gets group membership and user-scoped tools
# (Claude Code / OpenCode install into this user's home, not root's).
target_user: "{{ lookup('env', 'SUDO_USER') | default(lookup('env', 'USER'), true) }}"

# --- Privilege escalation --------------------------------------------------
# Ubuntu 25.10+ makes sudo-rs the default behind /usr/bin/sudo. It ignores the
# custom prompt Ansible passes with -p, wrapping it as
#   [sudo: <ansible prompt>] Password:
# so Ansible never matches its own prompt and every task — including Gathering
# Facts, since this play sets become at play level — dies with "Timed out
# waiting for become success or become password prompt".
#
# There, classic sudo is still installed as /usr/bin/sudo.ws
# (update-alternatives, priority 40). Point become at it directly rather than
# switching the system alternative, so nothing outside Ansible changes
# behaviour. On 24.04 and earlier that path does not exist and plain sudo is
# correct — hence the probe rather than a fixed value in ansible.cfg, which
# has no way to express a conditional.
#
# CAVEAT: `is exists` tests the *control* node's filesystem, which is only the
# same machine as the target because inventory.ini is
# `localhost ansible_connection=local`. If you repoint the inventory at remote
# hosts, this will probe the wrong box — set it per-host in the inventory, or
# override at runtime:
#   ansible-playbook site.yml -K -e ansible_become_exe=/usr/bin/sudo.ws
ansible_become_exe: "{{ '/usr/bin/sudo.ws' if '/usr/bin/sudo.ws' is exists else 'sudo' }}"

# --- Architecture ----------------------------------------------------------
# dpkg architectures this playbook is known to work on. Every third-party repo
# it configures — Docker, Brave, Chrome, VS Code, VSCodium, GitHub CLI, Claude
# Code — has a published index for both, so nothing is silently skipped on
# either one.
#
# The playbook resolves the running machine's architecture with
# `dpkg --print-architecture` and asserts it appears here. Widening this list
# is not enough on its own: an unlisted arch will get repos whose indices 404,
# and the assert is what stops that before the machine is half-configured.
supported_deb_architectures: [amd64, arm64]

# --- Feature toggles -------------------------------------------------------
# The `##` marker is not an ordinary comment: `bootstrap.sh -m` parses these
# lines to build its checklist, taking the name, the default state and the text
# after `##` as the menu label. Keep the marker on the same line as the toggle.
#
# A toggle without a `##` label still works — it just won't be offered in the
# menu, so anything meant to be switchable interactively needs one.
install_docker: true              ## Docker CE + compose & buildx plugins
install_kvm: true                 ## KVM — qemu, libvirt, virt-manager
install_brave: true               ## Brave browser
install_chrome: true              ## Google Chrome
install_vscode: true              ## Visual Studio Code
install_codium: true              ## VSCodium
install_btop: true                ## btop resource monitor
install_git: true                 ## Git
install_gh: true                  ## GitHub CLI (gh)
install_appimage_support: true    ## FUSE 2 runtime (needed by AppImages)
install_claude_code: true         ## Claude Code
install_opencode: true            ## OpenCode
install_hermes: true              ## Hermes Agent (Nous Research)
install_herdr: true               ## Herdr terminal workspace manager
install_graphify: true            ## Graphify code-graph CLI
install_devpod: true              ## DevPod dev-environment CLI
install_tailscale: true           ## Tailscale VPN
install_age: true                 ## age — file encryption (SOPS backend)
install_sops: true                ## SOPS — encrypted secrets in git

# --- Docker ----------------------------------------------------------------
# Adds target_user to the 'docker' group. This grants effective root on the
# host: anyone in this group can mount / into a container. Set false to keep
# Docker sudo-only.
docker_add_user_to_group: true

# Purge distro-packaged Docker (docker.io, podman-docker, containerd, runc)
# before installing Docker CE. Off by default because it removes packages you
# may not expect; Docker's own docs recommend it for a clean install.
docker_purge_distro_packages: false

# --- KVM -------------------------------------------------------------------
# The QEMU system emulator and the guest UEFI firmware are the only pieces of
# the virtualization stack that are specific to the host architecture; libvirt
# and the tooling around it are the same everywhere.
kvm_packages_common:
  - qemu-utils
  - libvirt-daemon-system
  - libvirt-daemon-config-network
  - libvirt-clients
  - virtinst
  - virt-manager
  - bridge-utils

# Keyed by dpkg architecture, so adding a platform means adding a key here.
#
# Not 'qemu-kvm' for the amd64 emulator: that is a virtual package, provided by
# both qemu-system-x86 and qemu-system-x86-hwe, and apt refuses to choose
# between providers ("has no installation candidate"). Name the real package.
# The -hwe variant tracks a newer QEMU on LTS; the plain one is standard.
kvm_packages_by_arch:
  amd64:
    - qemu-system-x86
    - ovmf              # x86 guest UEFI firmware
  arm64:
    - qemu-system-arm   # provides qemu-system-aarch64
    - qemu-efi-aarch64  # AAVMF, the arm64 guest UEFI firmware

# --- Tailscale -------------------------------------------------------------
# Unlike every other repo here, Tailscale's URL embeds the distro *and* its
# codename: pkgs.tailscale.com/stable/<distribution>/<suite>. Derivatives break
# that, because they report their own codename — Mint 22 is Ubuntu 24.04 but
# says 'wilma', and there is no wilma repo. On such a system name the upstream
# release instead:
#   -e tailscale_repo_distribution=ubuntu -e tailscale_repo_suite=noble
tailscale_repo_distribution: "{{ ansible_distribution | lower }}"
tailscale_repo_suite: "{{ ansible_distribution_release }}"

# Left empty, the playbook installs and starts tailscaled but does not join a
# tailnet — `tailscale up` without a key waits on an interactive browser login,
# which would hang the run. Connect afterwards with `sudo tailscale up`.
#
# To join unattended, pass a key at runtime rather than committing one here:
#   ansible-playbook site.yml -K -e tailscale_authkey=tskey-auth-...
tailscale_authkey: ""

# Extra flags for that `tailscale up`, e.g. "--ssh --accept-routes" or
# "--advertise-exit-node". Ignored unless tailscale_authkey is set.
tailscale_up_args: ""

# --- Claude Code -----------------------------------------------------------
# 'apt'    -> signed Anthropic apt repo, system-wide, updates via apt upgrade.
# 'native' -> curl|bash installer into ~/.local/bin, self-updating.
# You already have a 'native' install at ~/.local/bin/claude. That path
# normally precedes /usr/bin in PATH, so switching to 'apt' without removing
# the old one leaves two installs with the native one still winning.
claude_code_install_method: native

# 'stable' (~1 week behind, skips known-bad releases) or 'latest'.
claude_code_channel: stable

# --- DevPod ----------------------------------------------------------------
# DevPod ships no apt repo and no installer script: the CLI is a single static
# Go binary published as a GitHub release asset, and upstream's documented
# install is a curl of that asset into /usr/local/bin. It is how the copy
# already on this box got there — byte-identical to the devpod-linux-amd64
# asset. The CLI has no self-update either; upstream's advice for upgrading is
# to download the newer binary over it, which is what bumping this var does.
#
# So the version is pinned here rather than tracked. Bump it to upgrade; the
# playbook compares this string against `devpod version` and only downloads
# when they differ. Check for newer with:
#   curl -fsSL https://api.github.com/repos/loft-sh/devpod/releases/latest \
#     | grep '"tag_name"'
#
# 'latest' is deliberately not accepted: the guard needs an exact version to
# compare against, and without one every run would re-fetch 85 MB.
devpod_version: v0.6.15

# There is also a desktop app, but only for amd64 — installing it would make
# this the one component that skips arm64. Upstream no longer builds deb or rpm
# packages for it; the official package is now the AppImage, whose fuse2
# runtime install_appimage_support already provides. The CLI covers
# `devpod up`; add the GUI by hand if you want it.
devpod_install_dir: /usr/local/bin

# --- Graphify --------------------------------------------------------------
# The PyPI package is 'graphifyy'. Two y's is not a typo: the project ships
# under that name while 'graphify' is being reclaimed upstream, and the CLI it
# installs is still called graphify. The npm package of the same name is a
# different author's stub, so PyPI is the only correct source — the same
# warning .devcontainer/install-graphify.sh carries.
#
# Pinned, and pinned to the version the devcontainer pins, so the host and the
# container answer `graphify query` from the same build. Bump both together;
# latest is at https://pypi.org/project/graphifyy/.
graphify_version: "0.9.49"

# --- SOPS / age ------------------------------------------------------------
# age comes from the Ubuntu archive; the `age` package ships both `age` and
# `age-keygen`, and there is nothing to configure.
#
# SOPS does not. The archive's only match for the name is `orca-sops`, an
# unrelated GNOME package, and upstream publishes no apt repo — only a per-arch
# .deb attached to each GitHub release. That makes it the one component here
# installed from a direct URL, so unlike every other repo-backed component it
# needs a version: a URL cannot say "current" the way a suite can.
#
# 'latest' asks the GitHub releases API at run time, which is what keeps this
# tracking current. Pin a number instead — sops_version: "3.13.3" — on a
# machine that must not move, or where the unauthenticated API rate limit
# (60 requests/hour/IP) gets in the way. Unlike graphify_version there is no
# devcontainer pin to stay level with; nothing in .devcontainer installs SOPS.
sops_github_repo: getsops/sops
sops_version: latest
